name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_FUNCTIONS_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdmZmYmJtZXlseHJveHlvbHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MjQzODUsImV4cCI6MjEwNjEwMDM4NX0.onqk4nSuM00Sjr5Cr2dho_27LOYwSbGNzZBzK4efnoA
          VITE_SUPABASE_URL: https://advffbbmeylxroxyoltt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XUvbGM9QlOrKDOUYt75t9g_z2L_lf0L
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
